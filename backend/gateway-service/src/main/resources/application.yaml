server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          # 글로벌 CORS 설정-각 서비스 CORS 제거 후 일괄 처리
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "${CORS_ALLOWED_ORIGIN:http://localhost:5173}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600
          # 라우팅 규칙
          routes:
            # 1. 인증 서비스 라우팅: /api/auth/** → auth-service
            - id: auth-service-route
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
            # 2. SSE 라우팅: /sse/** → reactive-service
            #- id: reactive-service-sse-route
            #  uri: lb://reactive-service
            #  predicates:
            #    - Path=/sse/**
            # 3. WebSocket 라우팅: /ws/** → reactive-service
            - id: reactive-service-ws-route
              uri: lb://reactive-service
              predicates:
                - Path=/ws/**
            # 4. 일반 API 라우팅: /api/** → reactive-service
            - id: reactive-service-api-route
              uri: lb://reactive-service
              predicates:
                - Path=/api/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true

# Actuator-헬스체크
management:
  endpoints:
    web:
      exposure:
        include: health, info