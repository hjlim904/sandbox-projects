server:
  port: 8082

spring:
  application:
    name: reactive-service
  r2dbc:
    url: r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/schema.sql
  ai:
    openai:
      api-key: dummy-key-for-bootstrap

jwt:
  secret: DijYByK6FnJST8EHfT9GE2Bk/jWpzZ3QjtY6rpZNxV4= #연습이니 그냥 적음 원래는 노출되면 안됨

gemini:
  api-key: ${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE} # 환경변수 또는 직접 입력
  model: gemini-3.7-flash # Gemini 3.7 Flash
  thinking-budget: 1024 # Low (1024 tokens)

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true
